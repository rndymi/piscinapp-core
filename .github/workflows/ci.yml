name: CI

on:
  push:
    branches:
      - develop
      - 'release/v*.*.*'

jobs:
  verify:
    name: Verify Core
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      actions: read
      security-events: write

    services:
      postgres:
        image: postgres:17.11

        env:
          POSTGRES_DB: piscinappdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d piscinappdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/piscinappdb
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4

        with:
          languages: java
          queries: security-extended

      - name: Prepare Maven Wrapper
        run: chmod +x mvnw

      - name: Verify application
        run: ./mvnw -B verify

      - name: Analyze with SonarCloud
        if: github.ref == 'refs/heads/develop'

        env:
          SONAR_PISCINAPP_CORE_TOKEN: ${{ secrets.SONAR_PISCINAPP_CORE_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${SONAR_ORGANIZATION}
          -Dsonar.projectKey=${SONAR_PROJECT_KEY}
          -Dsonar.token=${SONAR_PISCINAPP_CORE_TOKEN}
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Build production Core image
        run: docker build -t piscinapp-core:ci .
