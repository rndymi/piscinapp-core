spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/piscinappdb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

    oauth:
      client-id: piscinapp-swagger
      scopes:
        - openid
        - profile
      use-pkce-with-authorization-code-grant: true

piscinapp:
  security:
    issuer: ${PISCINAPP_SECURITY_ISSUER:http://localhost:8080}

    cors:
      allowed-origins:
        - http://localhost:4200

      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS

      allowed-headers:
        - Authorization
        - Content-Type
        - Accept

      allow-credentials: false
      max-age: 1h

    oauth2:
      access-token-time-to-live: 15m
      refresh-token-time-to-live: 8h

      clients:
        swagger:
          enabled: true
          client-id: piscinapp-swagger

          grant-types:
            - authorization_code

          redirect-uris:
            - http://localhost:8080/swagger-ui/oauth2-redirect.html

          scopes:
            - openid
            - profile

        control:
          enabled: true
          client-id: piscinapp-control

          grant-types:
            - authorization_code
            - refresh_token

          redirect-uris:
            - http://localhost:4200/callback

          post-logout-redirect-uris:
            - http://localhost:4200

          scopes:
            - openid
            - profile
            - offline_access

  bootstrap:
    owner:
      username: local.owner
      password: local-owner-password
