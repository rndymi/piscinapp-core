server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

piscinapp:
  security:
    issuer: ${PISCINAPP_SECURITY_ISSUER}

    jwt:
      key-store-base64: ${JWT_KEYSTORE_BASE64}
      key-store-password: ${JWT_KEYSTORE_PASSWORD}
      key-password: ${JWT_KEY_PASSWORD}
      key-alias: ${JWT_KEY_ALIAS}
      key-id: ${JWT_KEY_ID}

    cors:
      allowed-origins:
        - ${PISCINAPP_CORS_ALLOWED_ORIGIN:}

      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS

      allowed-headers:
        - Authorization
        - Content-Type
        - Accept

      allow-credentials: false
      max-age: ${PISCINAPP_CORS_MAX_AGE:1h}

    oauth2:
      access-token-time-to-live: ${PISCINAPP_ACCESS_TOKEN_TTL:15m}
      refresh-token-time-to-live: ${PISCINAPP_REFRESH_TOKEN_TTL:8h}

      clients:
        validation:
          enabled: ${PISCINAPP_VALIDATION_CLIENT_ENABLED:false}
          client-id: ${PISCINAPP_VALIDATION_CLIENT_ID:piscinapp-validation}

          grant-types:
            - authorization_code

          redirect-uris:
            - ${PISCINAPP_VALIDATION_CLIENT_REDIRECT_URI:}

          scopes:
            - openid
            - profile

        control:
          enabled: ${PISCINAPP_CONTROL_CLIENT_ENABLED:false}
          client-id: ${PISCINAPP_CONTROL_CLIENT_ID:piscinapp-control}

          grant-types:
            - authorization_code
            - refresh_token

          redirect-uris:
            - ${PISCINAPP_CONTROL_REDIRECT_URI:}

          post-logout-redirect-uris:
            - ${PISCINAPP_CONTROL_POST_LOGOUT_REDIRECT_URI:}

          scopes:
            - openid
            - profile
            - offline_access

  bootstrap:
    owner:
      username: ${PISCINAPP_BOOTSTRAP_OWNER_USERNAME}
      password: ${PISCINAPP_BOOTSTRAP_OWNER_PASSWORD}
