spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/piscinappdb}
    username: ${TEST_DATABASE_USERNAME:postgres}
    password: ${TEST_DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: create-drop

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true

piscinapp:
  security:
    issuer: http://localhost:8080

    oauth2:
      access-token-time-to-live: 15m

      clients:
        test:
          enabled: true
          client-id: piscinapp-test
          redirect-uri: https://client.example.test/callback
          scopes:
            - openid
            - profile

  bootstrap:
    owner:
      username: test.owner
      password: test-owner-password
